plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.richfield.smartpantry'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.richfield.smartpantry"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Core UI: AppCompat activities, Material 3 components (bottom nav, text fields,
    // snackbars, date picker) and ConstraintLayout for the screen layouts.
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // Activity/Fragment: MainActivity hosts the three tab fragments; Activity also
    // provides EdgeToEdge and the ActivityResultLauncher used to return from Add/Edit.
    implementation libs.activity
    implementation libs.fragment

    // RecyclerView backs the pantry list and the suggested-recipes list.
    implementation libs.recyclerview

    // Local JUnit tests for the strict-matching logic (no device required).
    testImplementation libs.junit

    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}